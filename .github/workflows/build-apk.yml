name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messazipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Print build log as annotations (debug)
        if: always()
        run: |
          echo "---find apk/aab---"
          find . -iname "*.apk" -o -iname "*.aab" 2>/dev/null
          echo "---build.log line count---"
          wc -l build.log
          echo "---key lines---"
          grep -n -E "FAILURE|What went wrong|Caused by|error:|> Task|BUILD FAILED|Exception:|Execution failed" build.log | head -n 40 | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed 's/%/%25/g' | tr -d '\r' | cut -c1-500)
            echo "::error::${esc}"
          done
