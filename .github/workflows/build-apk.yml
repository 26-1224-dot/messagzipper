name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messazipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Report build log as an issue (debug)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "빌드 로그 (run ${{ github.run_id }}):"
            echo '```'
            tail -n 200 build.log
            echo '```'
            echo "---find apk---"
            find . -iname "*.apk"
          } > /tmp/fail-body.md
          gh issue create --repo "${{ github.repository }}" \
            --title "빌드 로그 (run ${{ github.run_id }})" \
            --body-file /tmp/fail-body.md || true
