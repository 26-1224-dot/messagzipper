name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify APK integrity
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$apk"
          sha256sum "$apk"
          unzip -l "$apk" | tail -5
          unzip -t "$apk" | tail -5

      - name: Verify APK signature
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          {
            echo "build-tools dir: $bt"
            "${bt}apksigner" verify --verbose --print-certs "$apk" 2>&1 || echo "APKSIGNER_FAILED exit=$?"
            echo "---aapt badging---"
            "${bt}aapt" dump badging "$apk" 2>&1 | head -25 || echo "AAPT_FAILED exit=$?"
          } > sign-check.log
          cat sign-check.log
          joined=$(sed 's/%/%25/g; s/\r//g' sign-check.log | awk '{printf "%s%%0A", $0}' | cut -c1-5000)
          echo "::error::${joined}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MessaZipper.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: messazipper-debug-apk
          path: MessaZipper.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" MessaZipper.apk \
            --repo "${{ github.repository }}" \
            --title "MessaZipper 빌드 #${{ github.run_number }}" \
            --notes "자동 빌드. 이 APK를 폰 브라우저에서 바로 받아 설치하세요." \
            --latest

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Print build log as annotations (debug)
        if: always()
        run: |
          echo "---find apk/aab---"
          find . -iname "*.apk" -o -iname "*.aab" 2>/dev/null
          echo "---build.log line count---"
          wc -l build.log
          echo "---non-stackframe lines (last 150, no 'at ...')---"
          joined=$(grep -vE '^\s*at ' build.log | tail -n 150 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}' | cut -c1-6000)
          echo "::error::${joined}"
